<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#F5B800" />
    </linearGradient>
    <linearGradient id="crestNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E235C" />
      <stop offset="100%" stop-color="#001744" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base: Sleek Rounded Container -->
  <rect width="512" height="512" rx="112" fill="#001438" />
  
  <!-- Subtle Outer Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFD907" stroke-width="6" stroke-opacity="0.4" />

  <!-- Top-Left Gold Square Accent (Authentic Kautilya Crest geometry) -->
  <rect x="86" y="86" width="170" height="170" fill="url(#crestGold)" rx="12" />

  <!-- Mint Teal Outer Chevron Border -->
  <rect x="136" y="136" width="240" height="240" rx="28" transform="rotate(45 256 256)" fill="none" stroke="#7AC19E" stroke-width="26" />

  <!-- Main Navy Diamond Shield -->
  <rect x="156" y="156" width="200" height="200" rx="20" transform="rotate(45 256 256)" fill="url(#crestNavy)" filter="url(#subtleShadow)" />

  <!-- Open Book Symbol (Emblem of Knowledge & Education) -->
  <!-- Left Page -->
  <path d="M 256 312 C 224 296 190 286 168 286 L 168 226 C 190 226 224 236 256 252 Z" fill="#FFFFFF" />
  <!-- Right Page -->
  <path d="M 256 312 C 288 296 322 286 344 286 L 344 226 C 322 226 288 236 256 252 Z" fill="#FFFFFF" />
  
  <!-- Golden Spine / Pages Center Divider -->
  <path d="M 256 250 L 256 318" stroke="url(#crestGold)" stroke-width="7" stroke-linecap="round" />
  
  <!-- Bottom Page Flare (Gold pages edge) -->
  <path d="M 172 288 C 196 288 228 298 256 314 C 284 298 316 288 340 288" fill="none" stroke="url(#crestGold)" stroke-width="5" stroke-linecap="round" />
</svg>
